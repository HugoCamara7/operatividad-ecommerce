    "CREDITCARD": "Mercado Pago"
    "YAPE MERCADO PAGO": "Yape"
    "MONNET - BANK TRANSFER": "Monnet"
    "MKP SHOPSTAR": "Shopstar"
    "NC": "Reversso"
    "67": "Vendemas"

  # La base OTIF identifica el sitio por su handle de plataforma
  # ("columbiaperu"); el maestro usa el nombre comercial ("Columbia").
