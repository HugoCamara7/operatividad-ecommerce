    "COLUMBIAPERU": "Columbia"
    "COLUMBIAPE": "Columbia"
    "HUSHPUPPIESPERU": "Hush Puppies"
    "HUSHPUPPIESPE": "Hush Puppies"
    "ROCKFORDPERU": "Rockford"
    "ROCKFORDPE": "Rockford"
    "VANSPERU": "Vans"
    "VANSPE": "Vans"
    "PARFOISPE": "Parfois"
    "PARFOISPERU": "Parfois"
    "PATAGONIAPE": "Patagonia"
    "PATAGONIAPERU": "Patagonia"
    "KEDSPE": "Keds"
