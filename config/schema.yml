  _null_tokens: ["-", "", "N/A", "NA", "NULL", "null", "(en blanco)", "#N/A", "nan", "None"]


# =============================================================================
#  REGLAS DE NEGOCIO
# =============================================================================
business:
  # Estados que representan una orden cancelada.
  estados_cancelados: ["Cancelada Final", "Cancelada Manual"]
  # Estado que representa una orden completada.
  estados_completados: ["Finalizada"]
  # Estados que representan trabajo aún en curso (backlog operativo).
  estados_backlog:
    - "Pendiente Despacho"
    - "Pendiente Empaque"
    - "Pendiente Asignacion"
    - "Pendiente Boleta"
    - "Pendiente Pago"
    - "Procesar Boleta"
    - "En Tienda"
    - "En Transito"
  # Valores afirmativos para banderas Sí/No.
