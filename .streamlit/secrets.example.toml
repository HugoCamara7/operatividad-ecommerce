# =============================================================================
#  Operatividad Control Center · secrets
#  Copie este archivo como .streamlit/secrets.toml y complete los valores.
#  NUNCA suba secrets.toml al repositorio.
#
#  Misma estructura que Catalog Control Center. Secciones que la aplicación
#  lee hoy:  [app_auth]  ·  [datasource]  ·  [bigquery]  ·  [gcp_service_account]
# =============================================================================


# -----------------------------------------------------------------------------
#  ORIGEN DIRECTO — BigQuery  (opcional)
#  Si enabled = true, el reporte se alimenta del datalake en lugar del Excel.
#  El Excel queda como respaldo automático si la consulta falla.
# -----------------------------------------------------------------------------
[bigquery]
enabled = false
project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
job_project_id = "PROYECTO_DONDE_SE_EJECUTA_EL_JOB"
# location = "US"

# Una consulta por conjunto de datos. Deben devolver las mismas columnas que el
# Excel (o cualquier alias declarado en config/schema.yml).
# ordenes_table  = "forus-analitica-prod-datalake.bronze.stg_pe_ecommerce_ordenes"
# ordenes_query  = """
# SELECT *
# FROM `forus-analitica-prod-datalake.bronze.stg_pe_ecommerce_ordenes`
# WHERE `Fecha Compra` >= DATE_SUB(CURRENT_DATE(), INTERVAL 400 DAY)
# """
# otif_query     = "SELECT * FROM `...stg_pe_ecommerce_otif`"
# carrier_query  = "SELECT * FROM `...stg_pe_ecommerce_carrier`"
# quiebres_query = "SELECT * FROM `...stg_pe_ecommerce_quiebres`"


# -----------------------------------------------------------------------------
#  ACCESO A LA APLICACIÓN
# -----------------------------------------------------------------------------
[app_auth]
# Puedes usar username/password para un solo usuario:
username = "admin"
password = "CAMBIAR_ESTA_CLAVE"

# O varios usuarios:
# [app_auth.users]
# "hugo.camara@forus.pe" = "CAMBIAR_ESTA_CLAVE"
# "luis.nunez@forus.pe" = "CAMBIAR_ESTA_CLAVE"


# -----------------------------------------------------------------------------
#  EXCEL MAESTRO
#  Fuente por defecto. Se usa siempre que BigQuery esté deshabilitado o falle.
# -----------------------------------------------------------------------------
[datasource]
# --- Opción A: carpeta sincronizada (recomendada en local) --------------------
# OneDrive/SharePoint monta el archivo como una ruta normal del sistema; la app
# detecta el cambio por su fecha de modificación. No requiere credenciales.
modo = "local"
ruta = "C:/Users/hcamara/OneDrive - Peru Forus S.A/Operacion/BD Operacion Ecommerce.xlsx"

# --- Opción B: enlace de descarga directa (recomendada en la nube) ------------
# Pegue el enlace "Compartir" tal cual: se convierte solo a descarga directa
# (SharePoint, OneDrive y Google Drive).
# modo = "url"
# url  = "https://forus-my.sharepoint.com/:x:/g/personal/usuario_forus_pe/EaBc123"

# Cada cuántos minutos revisar si el maestro cambió.
refrescar_cada_min = 60

# Nombre a mostrar en la cabecera (opcional).
# nombre = "BD Operación Ecommerce"


# -----------------------------------------------------------------------------
#  CUENTA DE SERVICIO GCP  (sólo si [bigquery].enabled = true)
# -----------------------------------------------------------------------------
[gcp_service_account]
type = "service_account"
project_id = "TU_PROJECT_ID"
private_key_id = "..."
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "tu-service-account@tu-project.iam.gserviceaccount.com"
client_id = "..."
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "..."
